<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BookMind — Recommendation Engine</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --bg2: #111111;
    --bg3: #1a1a1a;
    --border: #2a2a2a;
    --accent: #c8a96e;
    --accent2: #e8c98e;
    --text: #f0ede8;
    --muted: #666;
    --muted2: #888;
    --error: #c0605a;
    --card-h: 340px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* noise texture overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
    opacity: 0.4;
  }

  /* ─── HEADER ─── */
  header {
    position: relative;
    z-index: 10;
    padding: 3rem 4rem 2rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 2rem;
  }

  .logo {
    font-family: 'Playfair Display', serif;
    font-size: 1.6rem;
    font-weight: 900;
    letter-spacing: -0.02em;
    color: var(--text);
  }

  .logo span {
    color: var(--accent);
  }

  .tagline {
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    color: var(--muted);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding-top: 2px;
  }

  /* ─── HERO ─── */
  .hero {
    position: relative;
    z-index: 10;
    padding: 5rem 4rem 4rem;
    max-width: 1200px;
    margin: 0 auto;
  }

  .hero-label {
    font-family: 'DM Mono', monospace;
    font-size: 0.68rem;
    color: var(--accent);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-bottom: 1.5rem;
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }
  .hero-label::before {
    content: '';
    display: inline-block;
    width: 24px;
    height: 1px;
    background: var(--accent);
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.8rem, 5vw, 4.5rem);
    font-weight: 900;
    line-height: 1.05;
    letter-spacing: -0.03em;
    max-width: 700px;
    margin-bottom: 2.5rem;
  }

  h1 em {
    font-style: italic;
    color: var(--accent);
  }

  /* ─── SEARCH ─── */
  .search-wrap {
    display: flex;
    gap: 0;
    max-width: 640px;
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
    transition: border-color 0.2s;
    background: var(--bg2);
  }

  .search-wrap:focus-within {
    border-color: var(--accent);
  }

  #searchInput {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    padding: 1.1rem 1.5rem;
    font-family: 'DM Sans', sans-serif;
    font-size: 1rem;
    color: var(--text);
    caret-color: var(--accent);
  }

  #searchInput::placeholder {
    color: var(--muted);
  }

  #searchBtn {
    background: var(--accent);
    color: #0a0a0a;
    border: none;
    padding: 0 2rem;
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.2s;
    white-space: nowrap;
  }

  #searchBtn:hover { background: var(--accent2); }
  #searchBtn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ─── POPULAR STRIP ─── */
  .popular-strip {
    padding: 0 4rem 1.5rem;
    max-width: 1200px;
    margin: 0 auto;
    position: relative;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 1rem;
    flex-wrap: wrap;
  }

  .popular-label {
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    color: var(--muted);
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }

  .popular-pill {
    font-size: 0.8rem;
    padding: 0.35rem 0.9rem;
    border: 1px solid var(--border);
    border-radius: 100px;
    color: var(--muted2);
    cursor: pointer;
    transition: all 0.18s;
    background: transparent;
    font-family: 'DM Sans', sans-serif;
  }

  .popular-pill:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  /* ─── DIVIDER ─── */
  .divider {
    position: relative;
    z-index: 10;
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 4rem;
    height: 1px;
    background: var(--border);
    margin-bottom: 3rem;
  }

  /* ─── RESULTS ─── */
  #resultsSection {
    position: relative;
    z-index: 10;
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 4rem 6rem;
    display: none;
  }

  #resultsSection.visible { display: block; }

  .results-header {
    display: flex;
    align-items: baseline;
    gap: 1.5rem;
    margin-bottom: 2.5rem;
  }

  .results-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.4rem;
    font-weight: 400;
    font-style: italic;
    color: var(--muted2);
  }

  .results-query {
    font-family: 'Playfair Display', serif;
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--text);
  }

  .results-count {
    font-family: 'DM Mono', monospace;
    font-size: 0.68rem;
    color: var(--accent);
    letter-spacing: 0.1em;
    margin-left: auto;
  }

  /* ─── CARDS ─── */
  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 1.5rem;
  }

  .book-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.25s, border-color 0.25s;
    animation: fadeUp 0.5s both;
  }

  .book-card:hover {
    transform: translateY(-4px);
    border-color: var(--accent);
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .book-card:nth-child(1) { animation-delay: 0.05s; }
  .book-card:nth-child(2) { animation-delay: 0.12s; }
  .book-card:nth-child(3) { animation-delay: 0.19s; }
  .book-card:nth-child(4) { animation-delay: 0.26s; }

  .card-img-wrap {
    width: 100%;
    height: 260px;
    overflow: hidden;
    background: var(--bg3);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .card-img-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.4s;
    display: block;
  }

  .book-card:hover .card-img-wrap img {
    transform: scale(1.04);
  }

  .card-img-placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.5rem;
    color: var(--muted);
  }

  .card-img-placeholder svg {
    opacity: 0.3;
  }

  .card-body {
    padding: 1.2rem;
    border-top: 1px solid var(--border);
  }

  .card-title {
    font-family: 'Playfair Display', serif;
    font-size: 1rem;
    font-weight: 700;
    line-height: 1.35;
    margin-bottom: 0.4rem;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .card-author {
    font-size: 0.78rem;
    color: var(--muted2);
    font-family: 'DM Mono', monospace;
    letter-spacing: 0.02em;
  }

  .card-num {
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    color: var(--accent);
    opacity: 0.7;
    margin-bottom: 0.6rem;
  }

  /* ─── LOADER ─── */
  #loader {
    display: none;
    max-width: 1200px;
    margin: 0 auto;
    padding: 4rem;
    position: relative;
    z-index: 10;
  }

  #loader.visible { display: flex; align-items: center; gap: 1.5rem; }

  .loader-dots {
    display: flex;
    gap: 6px;
  }

  .loader-dots span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 1.2s ease-in-out infinite;
  }

  .loader-dots span:nth-child(2) { animation-delay: 0.2s; }
  .loader-dots span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes pulse {
    0%, 100% { opacity: 0.2; transform: scale(0.8); }
    50%       { opacity: 1;   transform: scale(1.2); }
  }

  .loader-text {
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem;
    color: var(--muted);
    letter-spacing: 0.1em;
  }

  /* ─── ERROR ─── */
  #errorBox {
    display: none;
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 4rem 3rem;
    position: relative;
    z-index: 10;
  }

  #errorBox.visible { display: block; }

  .error-inner {
    border: 1px solid #3a1f1f;
    background: #1a0e0e;
    border-radius: 4px;
    padding: 1.5rem 2rem;
    display: flex;
    align-items: center;
    gap: 1.5rem;
  }

  .error-icon {
    font-size: 1.5rem;
    opacity: 0.7;
  }

  .error-msg {
    font-size: 0.9rem;
    color: #e08080;
    line-height: 1.5;
  }

  .error-sub {
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    color: var(--muted);
    margin-top: 4px;
  }

  /* ─── BOTTOM DECORATION ─── */
  .decoration {
    position: fixed;
    bottom: -80px;
    right: -80px;
    width: 400px;
    height: 400px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(200,169,110,0.06) 0%, transparent 70%);
    pointer-events: none;
    z-index: 1;
  }

  @media (max-width: 768px) {
    header { padding: 2rem 1.5rem; flex-direction: column; gap: 0.5rem; }
    .hero { padding: 3rem 1.5rem 2rem; }
    .popular-strip { padding: 0 1.5rem 1.5rem; }
    .divider { padding: 0 1.5rem; margin: 0 1.5rem 2rem; }
    #resultsSection, #loader, #errorBox { padding-left: 1.5rem; padding-right: 1.5rem; }
    .cards-grid { grid-template-columns: repeat(2, 1fr); gap: 1rem; }
  }
</style>
</head>
<body>

<div class="decoration"></div>

<header>
  <div class="logo">Book<span>Mind</span></div>
  <div class="tagline">Collaborative Filtering Engine</div>
</header>

<section class="hero">
  <div class="hero-label">Powered by Cosine Similarity</div>
  <h1>Find your <em>next</em><br>great read.</h1>

  <div class="search-wrap">
    <input
      type="text"
      id="searchInput"
      placeholder="Enter a book title — e.g. The Da Vinci Code"
      autocomplete="off"
    />
    <button id="searchBtn" onclick="search()">Recommend →</button>
  </div>
</section>

<div class="popular-strip">
  <span class="popular-label">Try:</span>
  <button class="popular-pill" onclick="quickSearch('Harry Potter and the Chamber of Secrets')">Harry Potter</button>
  <button class="popular-pill" onclick="quickSearch('1984')">1984</button>
  <button class="popular-pill" onclick="quickSearch('The Da Vinci Code')">Da Vinci Code</button>
  <button class="popular-pill" onclick="quickSearch('The Hobbit')">The Hobbit</button>
  <button class="popular-pill" onclick="quickSearch('Animal Farm')">Animal Farm</button>
</div>

<div class="divider"></div>

<!-- Loader -->
<div id="loader">
  <div class="loader-dots">
    <span></span><span></span><span></span>
  </div>
  <div class="loader-text">Fetching recommendations...</div>
</div>

<!-- Error -->
<div id="errorBox">
  <div class="error-inner">
    <div class="error-icon">⊘</div>
    <div>
      <div class="error-msg" id="errorMsg">Book not found.</div>
      <div class="error-sub">Try a different title or check the spelling.</div>
    </div>
  </div>
</div>

<!-- Results -->
<section id="resultsSection">
  <div class="results-header">
    <div class="results-title">Because you liked</div>
    <div class="results-query" id="queryDisplay">—</div>
    <div class="results-count" id="countDisplay"></div>
  </div>
  <div class="cards-grid" id="cardsGrid"></div>
</section>

<script>
  const API_BASE = 'http://127.0.0.1:8000';

  const loader      = document.getElementById('loader');
  const errorBox    = document.getElementById('errorBox');
  const resultsSection = document.getElementById('resultsSection');
  const cardsGrid   = document.getElementById('cardsGrid');
  const searchInput = document.getElementById('searchInput');
  const searchBtn   = document.getElementById('searchBtn');

  searchInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') search();
  });

  function quickSearch(title) {
    searchInput.value = title;
    search();
  }

  function showLoader()  { loader.classList.add('visible'); }
  function hideLoader()  { loader.classList.remove('visible'); }
  function showError(msg){ errorBox.classList.add('visible'); document.getElementById('errorMsg').textContent = msg; }
  function hideError()   { errorBox.classList.remove('visible'); }
  function showResults() { resultsSection.classList.add('visible'); }
  function hideResults() { resultsSection.classList.remove('visible'); }

  function reset() {
    hideLoader(); hideError(); hideResults();
    cardsGrid.innerHTML = '';
  }

  async function search() {
    const query = searchInput.value.trim();
    if (!query) return;

    reset();
    showLoader();
    searchBtn.disabled = true;

    try {
      const encoded = encodeURIComponent(query);
      const res = await fetch(`${API_BASE}/recommend/${encoded}`);
      const data = await res.json();

      hideLoader();

      if (data.error) {
        showError(data.error);
        return;
      }

      const recs = data.recommendations;
      if (!recs || recs.length === 0) {
        showError('No recommendations found for this title.');
        return;
      }

      document.getElementById('queryDisplay').textContent = query;
      document.getElementById('countDisplay').textContent = `${recs.length} results`;
      renderCards(recs);
      showResults();

    } catch (err) {
      hideLoader();
      showError('Could not connect to the API. Make sure FastAPI server is running on port 8000.');
    } finally {
      searchBtn.disabled = false;
    }
  }

  function renderCards(books) {
    cardsGrid.innerHTML = '';
    books.forEach((book, i) => {
      const card = document.createElement('div');
      card.className = 'book-card';
      card.innerHTML = `
        <div class="card-img-wrap">
          ${book.image
            ? `<img src="${book.image}" alt="${esc(book.title)}" onerror="this.parentElement.innerHTML=placeholderSVG()">`
            : placeholderSVG()
          }
        </div>
        <div class="card-body">
          <div class="card-num">0${i+1}</div>
          <div class="card-title">${esc(book.title)}</div>
          <div class="card-author">${esc(book.author)}</div>
        </div>
      `;
      cardsGrid.appendChild(card);
    });
  }

  function placeholderSVG() {
    return `<div class="card-img-placeholder">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
      </svg>
      <span style="font-size:0.65rem;letter-spacing:0.1em;text-transform:uppercase;">No Cover</span>
    </div>`;
  }

  function esc(str) {
    if (!str) return '—';
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }
</script>
</body>
</html>
